<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003846">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<title>Inventario y Trazabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

:root{
  --azul:#003846; --rojo:#D51920;
  --btn:#003846; --btn-ink:#FFFFFF;
  --head:#003846;
  --azul-soft:#E1EBEE; --azul-line:#B9CDD3;
  --rojo-ink:#B3141A; --rojo-soft:#FBE8E9;
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#F6F8F9;
  --ink:#122429; --muted:#586C73; --line:#D7E0E3;
  --side:#003846; --side-ink:#DCE8EB; --side-muted:#8FAAB2; --side-hi:#0B4B5C;
  --shadow:0 1px 2px rgba(0,40,52,.06),0 4px 14px rgba(0,40,52,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --btn:#0D5467; --btn-ink:#FFFFFF; --head:#8FC4D2;
    --azul-soft:#15343D; --azul-line:#2A5260;
    --rojo:#EE3A40; --rojo-ink:#FF7479; --rojo-soft:#3A1619;
    --bg:#0A161A; --surface:#10232A; --surface-2:#142C34;
    --ink:#E3ECEE; --muted:#93A8AE; --line:#22414B;
    --side:#002730; --side-ink:#D5E3E7; --side-muted:#7F9BA3; --side-hi:#0A4150;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --btn:#0D5467; --btn-ink:#FFFFFF; --head:#8FC4D2;
  --azul-soft:#15343D; --azul-line:#2A5260;
  --rojo:#EE3A40; --rojo-ink:#FF7479; --rojo-soft:#3A1619;
  --bg:#0A161A; --surface:#10232A; --surface-2:#142C34;
  --ink:#E3ECEE; --muted:#93A8AE; --line:#22414B;
  --side:#002730; --side-ink:#D5E3E7; --side-muted:#7F9BA3; --side-hi:#0A4150;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);color:var(--head);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:700;line-height:1.05}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-block:18px}
.brand{display:flex;gap:12px;align-items:center;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.mark{width:36px;height:36px;flex:none;position:relative;border:2px solid var(--side-ink);border-radius:3px}
.mark::after{content:"";position:absolute;right:-2px;top:-2px;width:14px;height:14px;background:#D51920}
.mark::before{content:"";position:absolute;left:7px;bottom:7px;width:12px;height:2px;background:var(--side-ink);box-shadow:0 -6px 0 var(--side-ink)}
.brand{flex-direction:column;align-items:flex-start;gap:8px}
.brand .logo{width:176px;height:auto;display:block}
.brand small{font-size:10.5px}
.toplogo{display:none;height:28px;width:auto}
.qsearch{display:none;place-items:center;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:var(--r);cursor:pointer;margin-left:auto;color:var(--head)}
.qsearch svg{width:20px;height:20px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1;color:#fff;display:block;letter-spacing:.02em}
.brand small{font-size:11px;color:var(--side-muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:5px;cursor:pointer;font-size:14.5px;position:relative}
.nav button svg{width:19px;height:19px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--azul);font-weight:600}
[data-theme="dark"] .nav button[aria-current="page"],.nav button[aria-current="page"]{}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;background:#D51920;border-radius:0 2px 2px 0}
.nav button[aria-current="page"] svg{opacity:1;color:#D51920}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 12px}
.side-foot{margin-top:auto;padding:14px 20px 0;font-size:12px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:var(--side-ink);font-weight:600;display:block;font-size:13.5px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;max-width:620px}
.search input{border:0;background:none;outline:0;padding:10px 0;width:100%;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.userchip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.userchip span{font-size:13px;line-height:1.1}
.userchip small{display:block;color:var(--muted);font-size:11px}
.content{padding:24px;padding-bottom:40px;max-width:1280px;width:100%}
.demo-note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);padding:6px 24px}

.bottom{display:none}
.menu-btn{display:none}

/* ---------- common ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;min-height:42px;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface);color:var(--head);border-color:var(--azul-line)}
.btn.ghost:hover{background:var(--azul-soft)}
.btn.danger{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.danger-ghost{background:var(--surface);color:var(--rojo-ink);border-color:var(--rojo)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--head);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:3px;border:1px solid transparent;white-space:nowrap;line-height:1.35}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.b-solid{background:var(--btn);color:#fff}
.b-soft{background:var(--azul-soft);color:var(--head)}
.b-outline{background:transparent;color:var(--head);border-color:var(--azul-line)}
.b-dash{background:transparent;color:var(--head);border:1px dashed var(--head)}
.b-grey{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.b-crit{background:var(--rojo);color:#fff}
.b-crit-o{background:var(--rojo-soft);color:var(--rojo-ink);border-color:var(--rojo)}
.b-warn{background:var(--surface);color:var(--rojo-ink);border-color:var(--rojo)}
.b-strike{background:transparent;color:var(--rojo-ink);border-color:var(--rojo);text-decoration:line-through}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 11px;min-height:44px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--azul-line);border-color:var(--head)}
.field input:disabled,.field select:disabled{background:var(--surface-2);color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--rojo-ink);font-weight:600}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin:0;min-width:0}
legend{padding:0 6px;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--head)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--azul)}

/* home */
.home-search{display:flex;gap:10px;margin:18px 0 22px}
.home-search .search{max-width:none;padding:0 14px}
.home-search .search input{padding:15px 0;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;min-height:124px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--head)}
.tile svg{width:30px;height:30px;color:var(--head)}
.tile b{font-family:var(--f-display);font-size:21px;font-weight:600;color:var(--head);line-height:1}
.tile small{color:var(--muted);font-size:13px;display:block;margin-top:4px}
.tile.primary{background:var(--btn);border-color:var(--btn)}
.tile.primary svg,.tile.primary b{color:#fff}
.tile.primary small{color:#C6D9DE}
.tile .cnt{margin-left:auto}
.tile-top{display:flex;width:100%;align-items:flex-start}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,122px),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--head)}
.kpi .v{font-family:var(--f-display);font-size:42px;font-weight:600;line-height:1;color:var(--head);font-variant-numeric:tabular-nums}
.kpi.lead{background:var(--btn);border-color:var(--btn)}
.kpi.lead .v,.kpi.lead .lbl{color:#fff}
.kpi.crit .v{color:var(--rojo-ink)}
.kpi.crit.hot{border-color:var(--rojo)}
.kpi .sub{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.chart h3{margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{height:14px;background:var(--surface-2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.bar .f{height:100%;background:var(--btn)}
.bar .f.crit{background:var(--rojo)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px;margin:4px 0 6px;border-bottom:1px solid var(--line)}
.days div{background:var(--btn);border-radius:2px 2px 0 0;min-height:2px}
.days-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* table */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t tr.is-baja td{opacity:.6}
.code{font-family:var(--f-mono);font-weight:600;color:var(--head);font-size:13.5px}
.old{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;background:var(--azul-soft);display:block}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.filters .field select,.filters .field input{min-height:40px;padding:8px 10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}

/* ficha */
.ficha-head{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:22px;align-items:start}
.hero-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);background:var(--azul-soft);cursor:zoom-in;max-width:100%}
.numbox{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:10px 12px;border:1px dashed var(--azul-line);border-radius:var(--r);background:var(--surface-2);color:var(--head);font-weight:600}
.numbox svg{width:18px;height:18px;color:var(--muted)}
.perm{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.perm svg{width:13px;height:13px}
.ficha-code{font-family:var(--f-mono);font-size:30px;font-weight:600;color:var(--head);letter-spacing:.01em;line-height:1.1}
.ficha-type{font-family:var(--f-display);font-size:24px;font-weight:600;margin:2px 0 10px;color:var(--ink)}
.loc-line{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:14.5px}
.loc-line svg{width:18px;height:18px;flex:none;color:var(--head);margin-top:2px}
.origin{font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px;margin-top:16px}
.actions .btn{justify-content:flex-start;white-space:normal;text-align:left;line-height:1.2}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:10;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;margin:10px 0 6px;scrollbar-width:none}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--head);cursor:pointer;white-space:nowrap}
.sec{scroll-margin-top:130px}
.sec h2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec h2 .cnt{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600}
dl.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px 18px;margin:0}
dl.kv div{min-width:0}
dl.kv dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:14px}
.path span{background:var(--azul-soft);color:var(--head);padding:4px 9px;border-radius:3px;font-weight:600}
.path i{color:var(--muted);font-style:normal}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);cursor:zoom-in;text-align:left;padding:0;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--azul-soft)}
.ph .meta{padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.ph.crit{border-color:var(--rojo);box-shadow:inset 0 0 0 1px var(--rojo)}
.ph .star{font-size:11px;color:var(--head);font-weight:600}

.docs{display:flex;flex-direction:column}
.doc{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .ic{width:40px;height:48px;border:1px solid var(--azul-line);border-radius:3px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--head);background:var(--azul-soft)}
.doc b{display:block;overflow-wrap:anywhere;font-weight:600}

.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li::before{content:"";position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--head)}
.tl li.crit::before{border-color:var(--rojo);background:var(--rojo)}
.tl .when{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.tl .what{font-weight:600;font-size:15px;color:var(--ink);margin:1px 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl .d{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13.5px}
.tl .d dt{color:var(--muted)}
.tl .d dd{margin:0;overflow-wrap:anywhere}
.tl .arrow{color:var(--muted);padding:0 4px}
.ex{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}

.insp-state{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);margin-bottom:14px}
.insp-state.crit{border-color:var(--rojo);background:var(--rojo-soft)}
.insp-state .big{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1;color:var(--head);font-variant-numeric:tabular-nums}
.insp-state.crit .big{color:var(--rojo-ink)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,20,26,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:8px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:960px}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header .x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal .body{padding:20px}
.modal footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 8px 8px}
.lb img{width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:4px}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.qrlabel{border:2px solid var(--azul);border-radius:6px;display:grid;grid-template-columns:auto 1fr;overflow:hidden;background:#fff;color:#003846;max-width:460px}
.qrlabel .q{padding:12px;background:#fff}
.qrlabel .q img,.qrlabel .q canvas{display:block;width:150px!important;height:150px!important}
.qrlabel .i{padding:14px 16px;border-left:2px solid #003846;display:flex;flex-direction:column;justify-content:center;gap:4px}
.qrlabel .i .c{font-family:var(--f-mono);font-size:22px;font-weight:600}
.qrlabel .i .n{font-family:var(--f-display);font-size:18px;font-weight:600}
.qrlabel .i .s{font-size:11px;color:#586C73;text-transform:uppercase;letter-spacing:.06em}
.qrlabel .i .bar-r{height:5px;width:44px;background:#D51920;margin-top:6px}

/* tree */
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--azul-line)}
.tree>ul{padding-left:0;border:0}
.tree li{padding:6px 0}
.tree .node{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tree .node b{font-weight:600}
.tree .lvl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;min-width:62px}
.cnt-pill{font-size:12px;font-variant-numeric:tabular-nums;background:var(--azul-soft);color:var(--head);border-radius:999px;padding:1px 9px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}

/* alerts list */
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.aitem:hover{background:var(--surface-2)}
.aitem:last-child{border-bottom:0}
.days-left{font-family:var(--f-display);font-size:22px;font-weight:600;min-width:58px;text-align:center;color:var(--head);font-variant-numeric:tabular-nums;line-height:1}
.days-left small{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.days-left.crit{color:var(--rojo-ink)}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.login .l{background:#003846;color:#DCE8EB;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:30px;position:relative;overflow:hidden}
.login .l::after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border:34px solid rgba(255,255,255,.05);border-radius:50%}
.login .l h1{color:#fff;font-size:52px;line-height:.95;margin-top:40px}
.login .l p{max-width:40ch;color:#AFC6CC;font-size:16px}
.login .l .bar-r{width:64px;height:6px;background:#D51920;margin:18px 0}
.login .r{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:560px}
.ubtn{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;width:100%}
.ubtn:hover{border-color:var(--head)}
.ubtn b{display:block}
.ubtn small{color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:6px;z-index:200;font-weight:500;max-width:min(92vw,520px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.crit{background:var(--rojo);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:120;transform:translateX(-100%);transition:transform .2s ease;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .scrim{position:fixed;inset:0;background:rgba(0,20,26,.5);z-index:110}
  .menu-btn{display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:var(--r);cursor:pointer;flex:none}
  .menu-btn svg{width:22px;height:22px;color:var(--head)}
  .toplogo.logo-l{display:block}
  .search{min-width:0}
  .top{padding:10px 16px}
  .userchip > span:not(.avatar){display:none}
  .userchip{padding:4px}
  .content{padding:18px 16px 110px}
  .demo-note{padding:6px 16px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid rgba(255,255,255,.06)}
  .bottom button{border:0;background:none;color:var(--side-ink);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11px;cursor:pointer;position:relative}
  .bottom button svg{width:23px;height:23px}
  .bottom button[aria-current="page"]{color:#fff;font-weight:600}
  .bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:#D51920}
  .bottom .scan{color:#fff}
  .bottom .scan span.b{background:#D51920;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .ficha-head{grid-template-columns:1fr}
  .jump{top:calc(env(safe-area-inset-top,0px) + 63px)}
  .login{grid-template-columns:1fr}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .login .l{padding:32px 20px}
  .login .l h1{font-size:40px;margin-top:20px}
  .login .r{padding:24px 16px 40px}
}
@media (max-width: 760px){
  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody{display:block}
  table.t.cards tr{display:grid;grid-template-columns:52px 1fr auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
  table.t.cards td{border:0;padding:0;display:block}
  table.t.cards td.c-img{grid-row:1/4}
  table.t.cards td.c-code{grid-column:2}
  table.t.cards td.c-est{grid-column:3;grid-row:1;text-align:right}
  table.t.cards td.c-tipo{grid-column:2/4;font-weight:600}
  table.t.cards td.c-loc{grid-column:2/4;font-size:13px;color:var(--muted)}
  table.t.cards td.c-x{display:none}
  table.t.cards td.c-insp{grid-column:2/4;margin-top:4px}
  .qrbox{grid-template-columns:1fr}
  h1{font-size:27px}
  .kpi .v{font-size:36px}
}
@media (max-width: 900px) and (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toplogo.logo-l{display:none} :root:not([data-theme="light"]) .toplogo.logo-d{display:block} }
@media (max-width: 900px){ :root[data-theme="dark"] .toplogo.logo-l{display:none} :root[data-theme="dark"] .toplogo.logo-d{display:block} }
@media (max-width: 480px){ .toplogo{height:24px} .top .search{display:none} .top .qsearch{display:grid} .top{gap:8px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
